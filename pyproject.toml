[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "env",
    "migrations",
    ".git",
    "tmp",
]

[tool.ruff.lint]
# Keep the rule set practical: real bugs + import hygiene, not a full style rewrite.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bug patterns)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length is handled by line-length above, avoid double-reporting
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "B", "W"]
"tests/*" = ["B008", "B017"]  # fixture defaults and pytest.raises(Exception) are fine here

[tool.ruff.lint.isort]
known-first-party = ["appname"]
