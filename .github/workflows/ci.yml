name: MyTemplate CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APPNAME_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest-playwright

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # Static analysis / linting (Ruff)
      - name: Lint with Ruff
        run: make lint

      # Security scanning (Bandit)
      - name: Security scan with Bandit
        run: make security

      # Backend unit tests + coverage + JUnit XML
      - name: Run backend tests
        run: make test-unit

      # UI tests (Playwright) against the real running app
      - name: Run UI tests
        run: make test-ui

      # Make all reports easy to find and download from the Actions run
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: reports/
          retention-days: 14
